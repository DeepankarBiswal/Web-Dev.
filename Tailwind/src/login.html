<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Page</title>
    <link rel="stylesheet" href="output.css" />
  </head>
  <body class="bg-gray-800 flex justify-center items-center min-h-screen">
    <div class="bg-gray-600 rounded-lg p-8 shadow-2xl max-w-sm w-full">
      <h2 class="text-center text-3xl text-white mb-6 font-bold">Login</h2>
      <div class="mb-4">
        <form>
          <label for="" class="font-medium block text-sm text-gray-300 mb-2"
            >Email</label
          >
          <input
            class="w-full px-3 py-2 bg-gray-500 rounded-md text-white focus:outline-none focus:ring-2 focus:ring-blue-500"
            type="email"
            name=""
            id=""
            placeholder="Email..."
          />
        </form>
      </div mb-6>
      <div class="mb-6">
        <form>
          <label for="" class="font-medium block text-sm text-gray-300 mb-2"
            >Password</label
          >
          <input
            class="w-full px-3 py-2 bg-gray-500 rounded-md text-white focus:outline-none focus:ring-2 focus:ring-blue-500 mb-6"
            type="password"
            name=""
            id=""
            placeholder="Password..."
          />
        </form>
        <button class="w-full bg-blue-300 text-white py-2 rounded-md hover:bg-blue-700 shadow-xl" type="submit">Login</button>
      </div>
    </div>
  </body>
</html>
